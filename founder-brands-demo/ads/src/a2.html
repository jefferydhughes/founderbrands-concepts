<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css"><style>
.ad{background:#0B4A35;padding:90px 100px;display:flex;flex-direction:column;justify-content:center}

 -webkit-mask: radial-gradient(14px at 50% 0,#0000 98%,#000) 0 0/40px 51% repeat-x, radial-gradient(14px at 50% 100%,#0000 98%,#000) 0 100%/40px 51% repeat-x;}
.tape h2{font:700 56px/1.1 "Plex";margin:0 0 34px;letter-spacing:-.02em}

.hi{background:linear-gradient(transparent 58%,#D4F23C 58%)}

<div class="tape">

<div class="r"><span>Posts he wrote</span><span>0</span></div>
<div class="r"><span>Revenue added</span><span>$120,000/yr</span></div>
<div class="tot"><div>Qualified sales calls</div><div class="big"><span class="hi">16</span></div></div>

</div>
<div class="brand">FounderBrands</div>
</div></body></html>
